[package]
name = "roku-controller"
version = "0.1.0"
description = "A Roku Remote"
authors = ["mike herold"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "roku_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.7.4", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = [ "tray-icon", "rustls-tls" ] }
tauri-plugin-opener = "~2.7.2"
tauri-plugin-os = "~2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
once_cell = "1.21"
xml-rs = "1.0"
futures = "0.3"
futures-util = "0.3"
url = "2"
roku = { path = "../crates/roku" }
ssdp-client = { path = "../crates/ssdp-client" }
base64 = "0.23"
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = { version = "0.4", default-features = true, features = ["clock"] }
log = "0.4"
env_logger = "0.11"

[patch.crates-io]
roku = { path = "../crates/roku" }
ssdp-client = { path = "../crates/ssdp-client" }


# Desktop only: Android has no in-place updater, so the app downloads the
# release's APK and Android's installer replaces it (updates.rs, AppUpdate.kt)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14"

[dev-dependencies]
# updates.rs's tests build the phone's feed client on the desktop too
webpki-root-certs = "1"

[target.'cfg(target_os = "android")'.dependencies]
# The update check's HTTPS (updates.rs): Mozilla's roots, because reqwest's
# default platform verifier needs a JNI setup this app doesn't have
webpki-root-certs = "1"
android_logger = "0.15"
jni = "0.22"
ndk-context = "0.1"
