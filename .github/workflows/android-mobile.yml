name: Android Mobile Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri/gen/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android lint
        run: ./gradlew :app:lintArm64Debug -x rustBuildArm64Debug

      - name: Android unit tests
        run: ./gradlew :app:testArm64DebugUnitTest -x rustBuildArm64Debug
