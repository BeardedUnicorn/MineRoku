name: Android Mobile Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri/gen/android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Stay on v5: v6 moves caching into a proprietary component, and using it
      # means accepting Gradle's Terms of Use.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      # settings.gradle applies tauri.settings.gradle and MainActivity extends the
      # generated TauriActivity. Both are gitignored and written by Tauri's build
      # scripts, so run those with the variables `tauri android build` would set.
      - name: Generate Tauri Android files
        working-directory: src-tauri
        env:
          WRY_ANDROID_PACKAGE: com.rokucontroller.remote
          WRY_ANDROID_LIBRARY: roku_controller_lib
        run: |
          rustup target add aarch64-linux-android
          ndk_bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$ndk_bin/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          export TAURI_ANDROID_PROJECT_PATH="$PWD/gen/android"
          export WRY_ANDROID_KOTLIN_FILES_OUT_DIR="$TAURI_ANDROID_PROJECT_PATH/app/src/main/java/com/rokucontroller/remote/generated"
          mkdir -p "$WRY_ANDROID_KOTLIN_FILES_OUT_DIR"
          cargo check --locked --lib --target aarch64-linux-android

      - name: Android lint
        run: ./gradlew :app:lintArm64Debug -x rustBuildArm64Debug

      - name: Android unit tests
        run: ./gradlew :app:testArm64DebugUnitTest -x rustBuildArm64Debug
