name: Release

# A vX.Y.Z tag (pushed by `pnpm release publish`) builds every file a release
# ships, then creates the GitHub release with the version's CHANGELOG section.
# Manual runs, and pull requests that change how releases are built, build the
# same files as workflow artifacts and publish nothing.
#
# Desktop builds also make the signed updates, using the key in the
# TAURI_SIGNING_PRIVATE_KEY secret. The release gets the latest.json that
# installed apps check for updates (the README's "Updates"). The Android APK
# is signed with the release key in the ANDROID_KEYSTORE secret, so each APK
# installs over the one before (the README's "Android signing").
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release.mjs
      - scripts/release/**
      - src-tauri/tauri.conf.json
      - src-tauri/tauri.updater.conf.json
      - src-tauri/gen/android/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: Release script tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Also checks the version in each manifest, and that tauri.conf.json's
      # updater key is a real minisign key
      - run: node --test scripts/release/lib.test.mjs

  build:
    name: ${{ matrix.target }}
    needs: scripts
    strategy:
      fail-fast: false
      matrix:
        # desktop: the targets that make the app's updates
        include:
          - target: macos-arm64
            os: macos-26
            desktop: true
          # Cross-compiled on Apple silicon (scripts/release/lib.mjs buildPlan)
          - target: macos-x64
            os: macos-26
            desktop: true
          - target: windows-x64
            os: windows-2025
            desktop: true
          - target: android-arm64
            os: ubuntu-26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # A release without updates would leave installed apps where they are
      - name: The update can be signed
        if: matrix.desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret isn't set, so the update can't be signed (the README's \"Updates\")"
            exit 1
          fi

      # The CHANGELOG becomes the release notes, so Windows keeps LF line ends too
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The version comes from package.json's packageManager field
      - uses: pnpm/action-setup@v6

      # No dependency caches: a release is built from a clean install
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: The tag is the app's version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json says $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # The APK needs a JDK for Gradle, plus the SDK platform, Build-Tools
      # (apksigner, aapt2) and NDK that setup-env.sh installs for a local build
      - if: matrix.target == 'android-arm64'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK and NDK
        if: matrix.target == 'android-arm64'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # Every APK is signed with the release key, so it installs over the last
      # one. The build step checks the certificate as well. The existing Gradle
      # signingConfigs.release reads keystore.properties.
      - name: The APK can be signed
        if: matrix.target == 'android-arm64'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::The ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS secrets must all be set to sign the APK (the README's \"Android signing\")"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/roku-release.p12"
          {
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/roku-release.p12"
          } > src-tauri/gen/android/keystore.properties

      - run: node scripts/release.mjs build --target ${{ matrix.target }}
        env:
          # Signs the desktop updates. Only this step sees the key, and the
          # APK has no use for it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.desktop && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.desktop && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}

      - name: Forget the release key
        if: always() && matrix.target == 'android-arm64'
        run: rm -f src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/roku-release.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: releases/
          if-no-files-found: error

  github-release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          path: releases
          merge-multiple: true

      # Writes latest.json (the update feed) and creates the release with
      # every file, or replaces the files of a release that already exists
      - run: node scripts/release.mjs github-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
